schema: 1
id: com.bxi.pico_gmr_motion
name: PICO GMR任意动作
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: protected
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

runtime_profiles:
  pico_gmr_host:
    mode: host

nodes:
  pico_gmr_source:
    runtime: command
    entrypoint: pico_gmr_launcher.py
    interpreter: python3
    runtime_profile: pico_gmr_host
    execution: process
    lifecycle: state
    states:
      - pico_gmr_motion
    arguments:
      - --host
      - 127.0.0.1
      - --port
      - "5568"
      - --rate-hz
      - "50"
      - --human-height
      - "1.75"
    environment:
      PYTHONUNBUFFERED: "1"
    manifest:
      label: PICO GMR参考生成器
    runtime_requirements:
      python:
        - import: mujoco
        - import: numpy
      ros: []
      system: []
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 2.0
      kill_after: 4.0

events:
  activate:
    slot: btn_10
    value: 4

states:
  pico_gmr_motion:
    params:
      host: 127.0.0.1
      port: 5568
      stale_timeout_s: 0.4
      reference_yaw_mode: initial
      backend: auto
    manifest:
      label: PICO GMR任意动作
      priority: 875
      group: Advanced
      icon: accessibility_new
      confirm: true
      confirm_message: >-
        Mod会自动启动XRoboToolkit PC Service并保持RGMT站立平衡；进入后用PICO A+X开始或停止实时跟踪。首次测试必须使用吊架、低增益并准备急停。

routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: pico_gmr_motion
    transition:
      profile: dual_running_blend
      duration: 0.8
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition:
      profile: dual_running_blend
      duration: 0.8
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
