schema: 1
id: com.bxi.pico_gmr_motion
name: PICO GMR任意动作
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: protected
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

runtime_profiles:
  pico_gmr_host:
    mode: host

nodes:
  mediamtx_server:
    runtime: command
    entrypoint: mediamtx_launcher.py
    interpreter: python3
    runtime_profile: pico_gmr_host
    execution: process
    lifecycle: state
    states:
      - pico_gmr_motion
    arguments:
      - --config
      - runtime/mediamtx.yml
    environment:
      PYTHONUNBUFFERED: "1"
    scheduling:
      cpu_affinity: background
    manifest:
      label: PICO头部相机RTSP服务器
    runtime_requirements:
      python: []
      ros: []
      system: []
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 2.0
      kill_after: 4.0

  head_camera_rtsp:
    runtime: executable
    entrypoint: head_camera_rtsp_node
    runtime_profile: pico_gmr_host
    execution: process
    lifecycle: state
    states:
      - pico_gmr_motion
    depends_on:
      - mediamtx_server
    scheduling:
      cpu_affinity: background
    params:
      simulation_topic: /simulation/head_depth_camera/color/image_raw
      hardware_topic: /hardware/head_depth_camera/color/image_raw
      source_mode: auto
      source_timeout_s: 0.5
      hardware_promote_frames: 3
      rtsp_url: rtsp://127.0.0.1:2212/video
      readiness_host: 127.0.0.1
      readiness_port: 2212
      rtsp_transport: udp
      encoder: libx264
      output_width: 424
      output_height: 240
      output_fps: 60
      bitrate: 3000000
      gop_size: 15
      network_timeout_s: 2.0
      statistics_interval_s: 5.0
    manifest:
      label: PICO头部相机RTSP推流器
    runtime_requirements:
      python: []
      ros:
        - package: rclcpp
        - package: sensor_msgs
      system:
        - library: avcodec
        - library: avformat
        - library: avutil
        - library: swscale
        - library: x264
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 3.0
      kill_after: 5.0

  pico_gmr_source:
    runtime: command
    entrypoint: pico_gmr_launcher.py
    interpreter: python3
    runtime_profile: pico_gmr_host
    execution: process
    lifecycle: state
    states:
      - pico_gmr_motion
    arguments:
      - --host
      - 127.0.0.1
      - --port
      - "5568"
      - --rate-hz
      - "50"
      - --human-height
      - "1.75"
    environment:
      PYTHONUNBUFFERED: "1"
    manifest:
      label: PICO GMR参考生成器
    runtime_requirements:
      python:
        - import: mujoco
        - import: numpy
      ros: []
      system: []
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 2.0
      kill_after: 4.0

events:
  activate:
    slot: btn_10
    value: 4

states:
  pico_gmr_motion:
    params:
      host: 127.0.0.1
      port: 5568
      stale_timeout_s: 0.4
      reference_yaw_mode: initial
      backend: auto
    manifest:
      label: PICO GMR任意动作
      priority: 875
      group: Advanced
      icon: accessibility_new
      confirm: true
      confirm_message: >-
        Mod会自动启动XRoboToolkit PC Service并保持RGMT站立平衡；进入后用PICO A+X开始或停止实时跟踪。首次测试必须使用吊架、低增益并准备急停。

routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: pico_gmr_motion
    transition:
      profile: dual_running_blend
      duration: 0.8
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition:
      profile: dual_running_blend
      duration: 0.8
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
  - from: pico_gmr_motion
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
